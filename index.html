<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tracking</title>
<style>
:root {
  --bg: #1a1a1a; --fg: #ffffff; --accent: #ffeb3b; --cross: #00e5ff;
  --article: #ff5252; --dir: #4caf50; --border: #000;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; padding: 8px; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px;
  height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
header { display: flex; justify-content: space-between; align-items: center;
  padding: 4px 0; border-bottom: 2px solid var(--accent); }
h1 { margin: 0; font-size: 20px; }
select, button, input, textarea {
  background: #333; color: var(--fg); border: 2px solid var(--border);
  border-radius: 8px; padding: 8px; font-size: 16px;
}
button { min-height: 48px; min-width: 48px; font-weight: bold; }
button:active { transform: scale(0.95); }
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
#leg-view { flex: 1; overflow-y: auto; padding: 10px 0;
  display: flex; flex-direction: column-reverse; align-items: center; }
.flag { width: 90%; max-width: 400px; margin: 6px 0; padding: 10px;
  background: #222; border: 3px solid var(--accent); border-radius: 12px;
  display: flex; flex-direction: column; gap: 6px; }
.flag.active { border-color: #fff; box-shadow: 0 0 8px var(--accent); }
.flag.selected { border-color: #f44336 !important; box-shadow: 0 0 12px #f44336; }
.sel-note { color: #f44336; font-weight: bold; font-size: 13px; }
.bearing { font-size: 18px; padding: 6px; background: #000; border: 2px solid var(--accent); white-space: pre-wrap; word-wrap: break-word; min-height: 1.4em; text-align: left; }
.bearing:empty::before { content: "Bearing / aim point"; color: #777; }
.article-mark, .cross-stub, .flag div { white-space: pre-wrap; word-wrap: break-word; }
.cross-stub { height: auto !important; min-height: 40px; }
.dirs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.dirs button { background: var(--dir); color: #000; }
.cross-stub { width: 80%; height: 40px; background: var(--cross); margin: 4px auto;
  border: 2px solid var(--border); border-radius: 6px; display: flex;
  align-items: center; justify-content: space-around; font-size: 12px; color: #000; font-weight: bold; }
.article-mark { color: var(--article); font-weight: bold; }
#toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0;
  border-top: 2px solid var(--accent); justify-content: center; }
#mudmap-container { 
  position: relative; 
  width: 100%; 
  height: 160px; 
  background: #000; 
  border: 2px solid var(--accent); 
  border-radius: 8px; 
  margin-bottom: 8px;
  flex-shrink: 0;
}
#mudmap { width: 100%; height: 100%; }
#status { 
  font-size: 18px; 
  text-align: center; 
  padding: 8px 6px; 
  background: #222; 
  border-top: 2px solid var(--accent);
  flex-shrink: 0;
  line-height: 1.4;
  max-height: 120px;
  overflow: auto;
  font-weight: bold;
}
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
  align-items: center; justify-content: center; z-index: 100; }
.modal.show { display: flex; }
/* input colour by type: blue = direction/bearing, green = location (article, corner, start, hide...) */
#desc-modal.kind-dir #desc-input { background: #0d2b4d; border: 3px solid #42a5f5; color: #fff; }
#desc-modal.kind-dir #modal-title { color: #64b5f6; }
#desc-modal.kind-loc #desc-input { background: #10391a; border: 3px solid #4caf50; color: #fff; }
#desc-modal.kind-loc #modal-title { color: #81c784; }
.modal-content { background: #222; padding: 16px; border-radius: 12px; width: 90%;
  max-width: 400px; border: 3px solid var(--accent); }
#fullmap { position: fixed; inset: 0; background: #000; display: none; z-index: 150;
  flex-direction: column; overflow: hidden; touch-action: none; }
#fullmap.show { display: flex; }
#fullmap canvas { flex: 1; width: 100%; touch-action: none; }
</style>
</head>
<body>
<div id="start-page" style="position:fixed;inset:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;">
  <h1 style="color:#ffeb3b;margin-bottom:20px;">Tracking</h1>
  <p style="margin-bottom:16px;">Select track level</p>
  <select id="start-level" style="font-size:20px;padding:12px;margin-bottom:20px;">
    <option value="">-- Choose TD level --</option>
    <option value="1">TD1</option><option value="2">TD2</option><option value="3">TD3</option>
    <option value="4">TD4</option><option value="5">TD5</option><option value="6">TD6</option>
    <option value="7">TD7</option><option value="8">TD8</option><option value="9">TD9</option>
    <option value="10">TD10</option>
  </select>
  <button id="begin-btn" style="font-size:18px;padding:14px 28px;background:#ffeb3b;color:#000;">Begin Track</button>
  <button id="load-btn2" type="button" style="font-size:16px;padding:10px 24px;margin-top:10px;">📂 Load saved track</button>
</div>
<header>
  <h1>Tracking</h1>
  <select id="level">
    <option value="1">TD1</option><option value="2">TD2</option><option value="3">TD3</option>
    <option value="4">TD4</option><option value="5">TD5</option><option value="6">TD6</option>
    <option value="7">TD7</option><option value="8">TD8</option><option value="9">TD9</option>
    <option value="10">TD10</option>
  </select>
</header>
<div id="main">
  <div id="leg-banner" style="display:none;text-align:center;font-weight:bold;font-size:20px;padding:6px;border-radius:6px;margin:4px 0;"></div>
  <div id="leg-view"></div>
  <div id="mudmap-container"><canvas id="mudmap" width="140" height="140"></canvas></div>
</div>
<div id="status">Select level then start</div>
<div id="toolbar">
  <button id="add-flag">+50m Flag</button>
  <button id="del-flag">−50m Flag</button>
  <button id="div-l-btn" style="display:none">Div L</button>
  <button id="div-r-btn" style="display:none">Div R</button>
  <button id="finish-btn" type="button">Finish Track</button>
  <button id="undo">Undo</button>
  <button id="new-track">Save &amp; New</button>
  <button id="view-map">Full Map</button>
  <button id="load-btn" type="button">Load</button>
  <button id="new-nosave" type="button">New</button>
  <button id="export-btn" type="button">Export</button>
</div>

<div id="exit-modal" class="modal" style="z-index:400;">
  <div class="modal-content">
    <h3 id="exit-title" style="color:#ff9800;">Corner moved: choose exit</h3>
    <div id="exit-why" style="font-size:14px;margin-bottom:8px;"></div>
    <div id="exit-btns" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;"></div>
  </div>
</div>

<div id="load-modal" class="modal" style="z-index:300;">
  <div class="modal-content" style="max-height:80vh;overflow-y:auto;">
    <h3>Load saved track</h3>
    <button id="import-btn" type="button" style="width:100%;padding:10px;margin-bottom:6px;">📥 Import file</button>
    <input id="import-file" type="file" accept=".json,application/json" style="display:none">
    <div id="load-list"></div>
    <div style="margin-top:10px; display:flex; justify-content:flex-end;">
      <button id="load-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<div id="desc-modal" class="modal">
  <div class="modal-content">
    <h3 id="modal-title">Description</h3>
    <textarea id="desc-input" rows="6" placeholder="Location note (required)"></textarea>
    <div style="margin-top:8px;">
      <button type="button" id="dictate-btn" style="background:#ff5252;color:#fff;">🎤 Dictate</button>
      <span id="dictate-status" style="margin-left:8px;font-size:13px;color:#aaa;"></span>
    </div>
    <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
      <button id="desc-cancel">Cancel</button>
      <button id="desc-ok">OK</button>
    </div>
  </div>
</div>

<div id="pdf-modal" class="modal" style="z-index:300;">
  <div class="modal-content">
    <h3>Print PDF (A4) – names optional</h3>
    <label>Dog<br><input id="pdf-dog" style="width:100%"></label><br>
    <label>Competitor<br><input id="pdf-comp" style="width:100%"></label><br>
    <label>Judge<br><input id="pdf-judge" style="width:100%"></label><br>
    <label>Steward<br><input id="pdf-steward" style="width:100%"></label><br>
    <label>Date<br><input id="pdf-date" type="date" style="width:100%"></label>
    <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
      <button id="pdf-cancel" type="button">Cancel</button>
      <button id="pdf-make" type="button">Make PDF</button>
    </div>
  </div>
</div>

<div id="fullmap">
  <div style="padding:8px; display:flex; flex-wrap:wrap; gap:6px; justify-content:space-between; align-items:center;">
    <strong id="fullmap-title">Full Track Map – tap a leg to edit</strong>
    <button id="move-labels-btn" type="button" style="background:#555;color:#fff;">Move labels</button>
    <button id="pdf-btn" type="button" style="display:none;background:#fff;color:#000;">📄 PDF</button>
    <button id="close-fullmap">Close</button>
    <button id="recentre-btn" type="button" style="background:#ffeb3b;color:#000;">Recentre</button>
  </div>
  <canvas id="fullcanvas" width="400" height="600"></canvas>
</div>

<script>
const levelEl = document.getElementById('level');
const legView = document.getElementById('leg-view');
const statusEl = document.getElementById('status');
const mudmap = document.getElementById('mudmap');
const ctx = mudmap.getContext('2d');
const fullcanvas = document.getElementById('fullcanvas');
const fctx = fullcanvas.getContext('2d');

let level = 1;
let legs = [];
let currentLeg = null;
let history = [];
let articlesPlaced = 0;
let crossTracksPlaced = 0;
let pendingAction = null;
let hideDesc = '';
let trackDone = false;
function setTrackDone(v) { trackDone = v; const b = document.getElementById('pdf-btn'); if (b) b.style.display = v ? 'inline-block' : 'none'; }
let diversion = null;

// Dogs Australia (ANKC Ltd) — Rules for the conduct of Tracking Trials
// Effective 1 January 2024
// https://www.dogsaustralia.org.au/media/10068/11-da-tracking-01-01-2024.pdf
// All level-dependent checks read from RULES. A rule change is a one-place edit.
// FLAG_M is a plotting convention only (the rulebook does not fix flag spacing).
const FLAG_M = 50;
const RULES = {
  source: 'Dogs Australia (ANKC Ltd)',
  title: 'Rules for the conduct of Tracking Trials',
  edition: 'Effective 1 January 2024',
  url: 'https://www.dogsaustralia.org.au/media/10068/11-da-tracking-01-01-2024.pdf',
  flagM: FLAG_M,
  articleMinFromTurnM: 30,
  startClearanceM: 15,
  gateWidthM: 20,
  cross: { count: 2, angleDeg: 90, armM: 30, armMinM: 20, minFromTurnM: 30 },
  // Diversion plotted at 30° / 70m (as approved). Rulebook: V from start, min 50m; angle not specified.
  diversion: { minLengthM: 50, lengthM: 70, angleDeg: 30 },
  levels: {
    1:  { title:'TD',     person:'known',   lengthM:400,  minLegs:3, maxLegs:3,    minChanges:2, maxChanges:2,    articles:1, articlesIndicate:0, startArticleOnTrack:true,  acutes:0, allowAcute:false, firstMustNotBeAcute:false, maxConsecutiveAcutes:null, allowCross:false, crossCount:0, crossNote:'', allowDiversion:false, startType:'flag', firstCornerMinM:100, ageMin:20,  ageMax:45 },
    2:  { title:'TD',     person:'known',   lengthM:800,  minLegs:3, maxLegs:null, minChanges:2, maxChanges:null, articles:2, articlesIndicate:1, startArticleOnTrack:true,  acutes:0, allowAcute:false, firstMustNotBeAcute:false, maxConsecutiveAcutes:null, allowCross:false, crossCount:0, crossNote:'', allowDiversion:false, startType:'flag', firstCornerMinM:0,   ageMin:30,  ageMax:60 },
    3:  { title:'TD',     person:'unknown', lengthM:800,  minLegs:3, maxLegs:null, minChanges:2, maxChanges:null, articles:2, articlesIndicate:1, startArticleOnTrack:true,  acutes:0, allowAcute:false, firstMustNotBeAcute:false, maxConsecutiveAcutes:null, allowCross:false, crossCount:0, crossNote:'', allowDiversion:false, startType:'flag', firstCornerMinM:0,   ageMin:30,  ageMax:60 },
    4:  { title:'TDX',    person:'unknown', lengthM:1000, minLegs:5, maxLegs:null, minChanges:4, maxChanges:null, articles:3, articlesIndicate:2, startArticleOnTrack:true,  acutes:0, allowAcute:false, firstMustNotBeAcute:false, maxConsecutiveAcutes:null, allowCross:false, crossCount:0, crossNote:'', allowDiversion:false, startType:'flag', firstCornerMinM:0,   ageMin:60,  ageMax:120 },
    5:  { title:'TDX',    person:'unknown', lengthM:1000, minLegs:5, maxLegs:null, minChanges:4, maxChanges:null, articles:3, articlesIndicate:2, startArticleOnTrack:true,  acutes:0, allowAcute:false, firstMustNotBeAcute:false, maxConsecutiveAcutes:null, allowCross:true,  crossCount:2, crossNote:'one or two unknown persons', allowDiversion:false, startType:'flag', firstCornerMinM:0,   ageMin:60,  ageMax:120 },
    6:  { title:'TDX',    person:'unknown', lengthM:1200, minLegs:6, maxLegs:null, minChanges:5, maxChanges:null, articles:3, articlesIndicate:2, startArticleOnTrack:true,  acutes:1, allowAcute:true,  firstMustNotBeAcute:true,  maxConsecutiveAcutes:null, allowCross:true,  crossCount:2, crossNote:'one or two unknown persons', allowDiversion:false, startType:'flag', firstCornerMinM:0,   ageMin:60,  ageMax:180 },
    7:  { title:'T Ch',   person:'unknown', lengthM:1200, minLegs:7, maxLegs:null, minChanges:6, maxChanges:null, articles:3, articlesIndicate:2, startArticleOnTrack:false, acutes:2, allowAcute:true,  firstMustNotBeAcute:false, maxConsecutiveAcutes:null, allowCross:true,  crossCount:2, crossNote:'one or two unknown persons', allowDiversion:false, startType:'gate', firstCornerMinM:100, ageMin:90,  ageMax:180 },
    8:  { title:'T Ch',   person:'unknown', lengthM:1200, minLegs:8, maxLegs:null, minChanges:7, maxChanges:null, articles:3, articlesIndicate:2, startArticleOnTrack:false, acutes:2, allowAcute:true,  firstMustNotBeAcute:false, maxConsecutiveAcutes:null, allowCross:true,  crossCount:2, crossNote:'one or two unknown persons', allowDiversion:false, startType:'gate', firstCornerMinM:100, ageMin:120, ageMax:180 },
    9:  { title:'T Gr Ch',person:'unknown', lengthM:1200, minLegs:9, maxLegs:null, minChanges:8, maxChanges:null, articles:4, articlesIndicate:3, startArticleOnTrack:false, acutes:3, allowAcute:true,  firstMustNotBeAcute:false, maxConsecutiveAcutes:2,    allowCross:true,  crossCount:2, crossNote:'one unknown person and a dog', allowDiversion:false, startType:'gate', firstCornerMinM:100, ageMin:150, ageMax:210 },
    10: { title:'T Gr Ch',person:'unknown', lengthM:1200, minLegs:9, maxLegs:null, minChanges:8, maxChanges:null, articles:4, articlesIndicate:3, startArticleOnTrack:false, acutes:3, allowAcute:true,  firstMustNotBeAcute:false, maxConsecutiveAcutes:2,    allowCross:false, crossCount:0, crossNote:'', allowDiversion:true,  startType:'gate', firstCornerMinM:100, ageMin:180, ageMax:240 }
  }
};
function R(l) { return RULES.levels[l] || RULES.levels[1]; }
function allowAcute(l) { return !!R(l).allowAcute; }
function allowCross(l) { return !!R(l).allowCross; }
function allowDiversion(l) { return !!R(l).allowDiversion; }
function isAcuteDir(dir) { return dir === 'acL' || dir === 'acR'; }
function legLength(leg) { return (leg.flags || []).filter(f => !f.isStart).length * FLAG_M; }
function totalDist() { return legs.reduce((s, leg) => s + legLength(leg), 0); }
// Recount corners after every edit: each finished leg has exactly one corner, on its last flag.
// A turn type or corner note left on an earlier flag (after adding/deleting flags) moves to the corner.
function normalizeTrack() {
  legs.forEach((leg, li) => {
    const flags = leg.flags || [];
    if (li === legs.length - 1) return; // leg in progress: leave as entered
    let d = null, note = '';
    for (let i = flags.length - 1; i >= 0; i--) {
      const f = flags[i];
      if (f.isStart) continue;
      if (!d && f.direction) d = f.direction;
      if (!note && f.cornerNote) note = f.cornerNote;
    }
    d = d || leg.exitDir || null;
    const last = flags[flags.length - 1];
    flags.forEach(f => { if (f !== last) { f.direction = null; f.cornerNote = f.isStart ? f.cornerNote : ''; } });
    if (last && !last.isStart) { last.direction = d; last.cornerNote = last.cornerNote || note; }
    leg.exitDir = d;
  });
}
function countAcutes() {
  return turnDirs().filter(isAcuteDir).length;
}
function turnDirs() {
  const dirs = [];
  legs.forEach(leg => {
    let d = null;
    const flags = leg.flags || [];
    for (let i = flags.length - 1; i >= 0; i--) {
      if (flags[i].direction && !flags[i].isStart) { d = flags[i].direction; break; }
    }
    if (!d) d = leg.exitDir || null;
    if (d) dirs.push(d);
  });
  return dirs;
}
function maxAcuteRun(dirs) {
  let max = 0, run = 0;
  (dirs || turnDirs()).forEach(d => {
    if (isAcuteDir(d)) { run++; if (run > max) max = run; }
    else run = 0;
  });
  return max;
}
function minDistToTurnM(leg, flagIndex, atFlag, opts) {
  const f = leg.flags[flagIndex];
  if (!f) return 0;
  const pos = atFlag ? f.id * FLAG_M : (f.id - 0.5) * FLAG_M;
  const turns = [];
  const legIdx = legs.indexOf(leg);
  if (legIdx > 0) turns.push(0);
  const lastI = leg.flags.length - 1;
  const isFinal = legIdx === legs.length - 1;
  leg.flags.forEach((fl, i) => {
    if (fl.isStart) return;
    const isLast = i === lastI;
    if (fl.direction) turns.push(fl.id * FLAG_M);
    else if (isLast && (!isFinal || (opts && opts.treatCurrentEndAsTurn))) turns.push(fl.id * FLAG_M);
  });
  if (!turns.length) return Infinity;
  return Math.min.apply(null, turns.map(t => Math.abs(pos - t)));
}
function articleCheck(leg, flagIndex, atFlag, opts) {
  const r = R(level);
  const f = leg && leg.flags[flagIndex];
  if (!f) return 'No flag';
  if (f.isStart) {
    if (!atFlag) return 'No track before the start flag';
    if (!r.startArticleOnTrack) return 'For TD' + level + ' the start article goes in a scent bag, not on the track';
    return null;
  }
  const d = minDistToTurnM(leg, flagIndex, atFlag, opts);
  if (d < RULES.articleMinFromTurnM) {
    return 'Articles cannot be on a turn or within ' + RULES.articleMinFromTurnM + 'm of a turn (this spot is ' + d + 'm away)';
  }
  return null;
}
function placementBlockedByTurn(leg, flagIndex) {
  const turnM = leg.flags[flagIndex].id * FLAG_M;
  for (const f of leg.flags) {
    if (!f.article) continue;
    const pos = f.article.atFlag ? f.id * FLAG_M : (f.id - 0.5) * FLAG_M;
    if (Math.abs(pos - turnM) < RULES.articleMinFromTurnM) {
      return 'Move the article at Flag ' + f.id + ' first — articles must be at least ' + RULES.articleMinFromTurnM + 'm from a turn';
    }
  }
  for (const c of (leg.crossTracks || [])) {
    const fl = (c.afterFlag != null && leg.flags[c.afterFlag]) || leg.flags.find(x => x.id === c.flagId);
    if (!fl) continue;
    const pos = (fl.id - 0.5) * FLAG_M;
    if (Math.abs(pos - turnM) < RULES.cross.minFromTurnM) {
      return 'Move the cross track first — it must be at least ' + RULES.cross.minFromTurnM + 'm from a turn';
    }
  }
  return null;
}
function rulesProblems() {
  const r = R(level);
  const problems = [];
  const dist = totalDist();
  const acutes = countAcutes();
  if (r.maxLegs && legs.length > r.maxLegs) problems.push('Legs ' + legs.length + ' (TD' + level + ' has exactly ' + r.maxLegs + ')');
  if (legs.length < r.minLegs) problems.push('Legs ' + legs.length + '/' + r.minLegs);
  if (dist < r.lengthM) problems.push('Distance ' + dist + '/' + r.lengthM + 'm');
  if (articlesPlaced < r.articles) problems.push('Articles ' + articlesPlaced + '/' + r.articles);
  if (r.acutes > 0 && acutes < r.acutes) problems.push('Acutes ' + acutes + '/' + r.acutes);
  if (r.allowCross && crossTracksPlaced !== r.crossCount) problems.push('Cross tracks ' + crossTracksPlaced + '/' + r.crossCount);
  if (r.allowDiversion && !legs.some(l => l.diversion)) problems.push('Diversion not set');
  if (r.firstCornerMinM && legs[0] && (legs.length > 1 || (legs[0].flags || []).some(f => f.direction))) {
    const n = legLength(legs[0]);
    if (n < r.firstCornerMinM) problems.push('First corner ' + n + 'm (min ' + r.firstCornerMinM + 'm)');
  }
  if (r.firstMustNotBeAcute && isAcuteDir(turnDirs()[0])) problems.push('First change of direction must not be acute');
  if (r.maxConsecutiveAcutes && maxAcuteRun() > r.maxConsecutiveAcutes) {
    problems.push('No more than ' + r.maxConsecutiveAcutes + ' acute turns in a row');
  }
  if (r.startArticleOnTrack) {
    const has = legs[0] && (legs[0].flags || []).some(f => f.isStart && f.article);
    if (!has) problems.push('Start article required');
  }
  legs.forEach((leg, li) => {
    (leg.flags || []).forEach((f, i) => {
      if (!f.article) return;
      const err = articleCheck(leg, i, !!f.article.atFlag, { treatCurrentEndAsTurn: li < legs.length - 1 });
      if (err) problems.push('Flag ' + f.id + ': ' + err);
    });
    (leg.crossTracks || []).forEach(c => {
      const idx = c.afterFlag;
      if (idx == null || !leg.flags[idx]) return;
      const d = minDistToTurnM(leg, idx, false, { treatCurrentEndAsTurn: li < legs.length - 1 });
      if (d < RULES.cross.minFromTurnM) problems.push('Cross too close to a turn (' + d + 'm, min ' + RULES.cross.minFromTurnM + 'm)');
    });
  });
  return problems;
}


function saveState() {
  setTrackDone(false);
  history.push(JSON.stringify({legs, currentLeg, articlesPlaced, crossTracksPlaced, hideDesc}));
  if (history.length > 40) history.shift();
}
function undo() {
  if (history.length < 2) return;
  history.pop();
  const prev = JSON.parse(history[history.length-1]);
  Object.assign({legs, currentLeg, articlesPlaced, crossTracksPlaced, hideDesc}, prev);
  legs = prev.legs; currentLeg = legs.length ? legs[legs.length-1] : null; articlesPlaced = prev.articlesPlaced;
  crossTracksPlaced = prev.crossTracksPlaced; hideDesc = prev.hideDesc || '';
  render();
}

function newLeg() {
  const rules = R(level);
  if (rules.maxLegs && legs.length >= rules.maxLegs) {
    return alert('TD' + level + ' has exactly ' + rules.maxLegs + ' legs (' + rules.maxChanges + ' changes of direction)');
  }
  if (legs.length === 1 && currentLeg && rules.firstCornerMinM) {
    const n = legLength(currentLeg);
    if (n < rules.firstCornerMinM) {
      return alert('First change of direction must be at least ' + rules.firstCornerMinM + 'm from the start (this leg is ' + n + 'm)');
    }
  }
  saveState();
  let exitDir = null;
  if (currentLeg && currentLeg.flags.length > 0) {
    for (let i = currentLeg.flags.length - 1; i >= 0; i--) {
      if (currentLeg.flags[i].direction && !currentLeg.flags[i].isStart) {
        exitDir = currentLeg.flags[i].direction;
        break;
      }
    }
    if (!exitDir) exitDir = currentLeg.exitDir;
    currentLeg.exitDir = exitDir;
  }
  const isGate = R(level).startType === 'gate';
  const isFirst = legs.length === 0;
  currentLeg = {
    id: legs.length + 1,
    start: isFirst ? { type: isGate ? 'gate' : 'flag', desc: '', gps: null } : null,
    flags: isFirst 
      ? [{id:0, bearing:'', direction:null, article:null, gps:null, isStart:true}, {id:1, bearing:'', direction:null, article:null, gps:null}]
      : [{id:1, bearing:'', direction:null, article:null, gps:null}],
    crossTracks: [],
    diversion: null,
    entryDir: exitDir
  };
  if (isFirst && R(level).startArticleOnTrack) {
    // TD1-6: start article sits on the start flag automatically as A0 (not counted as a track article)
    currentLeg.flags[0].article = {desc: 'A0: Start article', label: 'A0', atFlag: true, gps: null};
  }
  legs.push(currentLeg);
  // Draw immediately so mud map shows Flag 1 before any further UI
  render();
  drawMud();
  if (isFirst) {
    openDesc(isGate ? 'Start gate description (' + RULES.gateWidthM + 'm line)' : 'Start flag description (Flag 0)', desc => {
      if (currentLeg && currentLeg.start) currentLeg.start.desc = desc;
      render();
    });
  }
}

function addFlag() {
  if (!currentLeg) { newLeg(); return; }
  const si = selectedFlag ? currentLeg.flags.indexOf(selectedFlag) : -1;
  if (si >= 0 && si < currentLeg.flags.length - 1) {
    // insert a flag after the selected one; later flags move out 50m
    saveState();
    const sel = currentLeg.flags[si];
    const nf = { id: sel.isStart ? 1 : sel.id + 1, bearing: sel.bearing || currentLeg.flags[si + 1].bearing || '', direction: null, article: null, gps: null };
    for (let j = si + 1; j < currentLeg.flags.length; j++) currentLeg.flags[j].id += 1;
    currentLeg.flags.splice(si + 1, 0, nf);
    currentLeg.crossTracks.forEach(ct => { if (ct.afterFlag > si) { ct.afterFlag += 1; if (ct.flagId !== undefined) ct.flagId += 1; } });
    if (currentLeg.diversion && currentLeg.diversion.atFlag >= nf.id) currentLeg.diversion.atFlag += 1;
    selectedFlag = nf;
    render();
    return;
  }
  saveState();
  const last = currentLeg.flags[currentLeg.flags.length-1];
  const nextId = last.isStart ? 1 : (last.id + 1);
  const cornerLeg = legs.indexOf(currentLeg) < legs.length - 1 ? currentLeg : null;
  currentLeg.flags.push({
    id: nextId,
    bearing: last.bearing || '',
    direction: null, article: null, gps: null
  });
  const newIdx = currentLeg.flags.length - 1;
  const alreadyHasBearing = currentLeg.flags.some(f => !f.isStart && f.bearing);
  render();
  if (!alreadyHasBearing) {
    openDesc('Bearing / aim point', desc => {
      // Apply from the leg's FIRST real flag (Flag 1), not the flag just added
      const firstIdx = currentLeg.flags.findIndex(f => !f.isStart);
      const from = firstIdx >= 0 ? firstIdx : newIdx;
      for (let j = from; j < currentLeg.flags.length; j++) {
        currentLeg.flags[j].bearing = desc;
      }
      render();
    });
  } else {
    currentLeg.flags[newIdx].bearing = last.bearing || '';
    render();
  }
  if (cornerLeg) promptExit(cornerLeg, 'You added a flag after the corner, so the corner moved out 50m.');
}

// v7.4: set a bearing/aim point from flag i onward, but stop at the first later flag that
// already has a different bearing (a later aim point is never overwritten)
function setBearingFrom(leg, i, desc) {
  const old = leg.flags[i].bearing || '';
  leg.flags[i].bearing = desc;
  for (let j = i + 1; j < leg.flags.length; j++) {
    const b = leg.flags[j].bearing || '';
    if (b && b !== old) break;
    leg.flags[j].bearing = desc;
  }
}
let selectedFlag = null; // flag tapped in the leg list or on the map; −50m deletes it
function relabelArticles() {
  let n = 0;
  legs.forEach(leg => (leg.flags || []).forEach(f => {
    if (!f.article || f.isStart) return;
    n++;
    const lab = 'A' + n;
    f.article.desc = f.article.desc.replace(/^A\d+: /, lab + ': ');
    f.article.label = lab;
  }));
  articlesPlaced = n;
}
function delFlag() {
  if (!currentLeg || !currentLeg.flags.length) return;
  let idx = currentLeg.flags.length - 1;
  const si = selectedFlag ? currentLeg.flags.indexOf(selectedFlag) : -1;
  if (si >= 0) idx = si;
  const f = currentLeg.flags[idx];
  if (f.isStart) return alert('Cannot delete start');
  if (si >= 0 && idx < currentLeg.flags.length - 1 && !confirm('Delete Flag ' + f.id + ' (' + f.id * FLAG_M + 'm) on leg ' + (legs.indexOf(currentLeg) + 1) + '? Later flags move up 50m.')) return;
  saveState();
  currentLeg.flags.splice(idx, 1);
  // later flags close the gap
  for (let j = idx; j < currentLeg.flags.length; j++) currentLeg.flags[j].id -= 1;
  currentLeg.crossTracks = currentLeg.crossTracks.filter(ct => ct.afterFlag !== idx).map(ct => {
    if (ct.afterFlag > idx) { ct.afterFlag -= 1; if (ct.flagId !== undefined) ct.flagId -= 1; }
    return ct;
  });
  crossTracksPlaced = legs.reduce((n, l) => n + (l.crossTracks || []).length, 0);
  if (currentLeg.diversion && currentLeg.diversion.atFlag > f.id) currentLeg.diversion.atFlag -= 1;
  selectedFlag = null;
  const li = legs.indexOf(currentLeg);
  const wasCorner = idx === currentLeg.flags.length && li < legs.length - 1; // deleted the corner flag of a finished leg
  const minFlags = currentLeg.flags[0] && currentLeg.flags[0].isStart ? 1 : 0;
  let exitLeg = null, why = '';
  if (currentLeg.flags.length <= minFlags && legs.length > 1 && li > 0) {
    legs.splice(li, 1);
    const prev = legs[li - 1];
    currentLeg = legs[Math.min(li, legs.length - 1)];
    if (li - 1 < legs.length - 1) { exitLeg = prev; why = 'Leg ' + (li + 1) + ' was removed, so Leg ' + li + ' now turns into a different leg.'; }
    else {
      // previous leg is now the leg in progress: its old exit no longer applies
      prev.flags.forEach(f => { if (!f.isStart) f.direction = null; }); prev.exitDir = null; currentLeg = prev;
      alert('Leg ' + (li + 1) + ' removed. Leg ' + li + ' exit cleared: choose the new direction on its last flag.');
    }
  } else if (wasCorner) { exitLeg = currentLeg; why = 'You deleted the corner flag, so the corner moved back 50m.'; }
  relabelArticles();
  render();
  if (exitLeg) promptExit(exitLeg, why);
}

function setDirection(flagIndex, dir) {
  const rules = R(level);
  if (isAcuteDir(dir) && !rules.allowAcute) { alert('Acute turns are not used on TD' + level); return false; }
  if (isAcuteDir(dir) && rules.firstMustNotBeAcute && legs.length === 1) {
    alert('The first change of direction on TD' + level + ' must be 30–90° (not acute)'); return false;
  }
  if (isAcuteDir(dir) && rules.maxConsecutiveAcutes) {
    const prior = legs.slice(0, -1).map(l => l.exitDir).filter(Boolean);
    if (maxAcuteRun(prior.concat([dir])) > rules.maxConsecutiveAcutes) {
      alert('No more than ' + rules.maxConsecutiveAcutes + ' acute turns in a row on TD' + level); return false;
    }
  }
  const blocked = placementBlockedByTurn(currentLeg, flagIndex);
  if (blocked) { alert(blocked); return false; }
  saveState();
  currentLeg.flags[flagIndex].direction = dir;
  render();
  return true;
}

function placeArticle(flagIndex, desc, atFlag) {
  if (articlesPlaced >= (R(level).articles || 0)) return alert('Article quota reached');
  const artErr = articleCheck(currentLeg, flagIndex, !!atFlag);
  if (artErr) return alert(artErr);
  saveState();
  const label = 'A' + (articlesPlaced + 1); // A0 = start article (not counted)
  currentLeg.flags[flagIndex].article = {desc: label + ': ' + desc, label, atFlag: !!atFlag, gps: null};
  articlesPlaced++;
  relabelArticles();
  render();
  drawMud();
}

function placeCross(flagIndex, desc) {
  if (!allowCross(level)) return;
  const need = R(level).crossCount;
  if (crossTracksPlaced >= need) return alert('This test has ' + need + ' cross tracks on the whole track');
  const d = minDistToTurnM(currentLeg, flagIndex, false);
  if (d < RULES.cross.minFromTurnM) return alert('A cross track must be at least ' + RULES.cross.minFromTurnM + 'm from a turn (this spot is ' + d + 'm)');
  saveState();
  const flagId = currentLeg.flags[flagIndex] ? currentLeg.flags[flagIndex].id : flagIndex;
  currentLeg.crossTracks.push({ afterFlag: flagIndex, flagId: flagId, desc, gps: null });
  crossTracksPlaced++;
  render();
}

function autoSave() {
  try {
    if (legs.length) localStorage.setItem('tracking-autosave', JSON.stringify({level, legs, articlesPlaced, crossTracksPlaced, hideDesc, trackDone, t: Date.now()}));
  } catch (e) {}
}
function render() {
  try { normalizeTrack(); } catch (e) {}
  setTimeout(autoSave, 0);
  level = parseInt(levelEl.value) || level;
  document.getElementById('div-l-btn').style.display = allowDiversion(level) ? 'inline-block' : 'none';
  document.getElementById('div-r-btn').style.display = allowDiversion(level) ? 'inline-block' : 'none';

  if (!currentLeg) {
    legView.innerHTML = '<p style="text-align:center;margin-top:40px">Tap Begin or +50m Flag</p>';
    statusEl.textContent = `TD${level} – ready`;
    drawMud();
    return;
  }

  legView.innerHTML = '';
  { // always-visible leg banner (outside the scrolling list)
    const li = legs.indexOf(currentLeg);
    const editing = li >= 0 && li < legs.length - 1;
    const ban = document.getElementById('leg-banner');
    ban.style.display = 'block';
    ban.style.background = editing ? '#ff9800' : '#333';
    ban.style.color = editing ? '#000' : '#ffeb3b';
    if (selectedFlag && !currentLeg.flags.includes(selectedFlag)) selectedFlag = null;
    const sf = selectedFlag;
    const chips = currentLeg.flags.map((f, i) => `<button type="button" class="flag-chip" data-i="${i}" style="min-width:40px;padding:6px 8px;margin:2px;font-weight:bold;border-radius:6px;border:2px solid ${f === sf ? '#f44336' : '#666'};background:${f === sf ? '#f44336' : '#222'};color:#fff;">F${f.isStart ? 0 : f.id}${f.article ? '•' : ''}</button>`).join('');
    const hint = sf
      ? `Flag ${sf.isStart ? 0 : sf.id} selected: −50m deletes it, +50m adds after it`
      : 'Tap a flag to edit it (otherwise ±50m works on the last flag)';
    const artBtns = (sf && sf.article && !sf.isStart) ? `<div style="margin-top:4px;"><button type="button" id="chip-art-del" style="padding:6px 10px;margin:2px;background:#f44336;color:#fff;">✕ Delete article ${sf.article.label || ''} on F${sf.id}</button></div>` : (sf && !sf.article) ? `<div style="margin-top:4px;"><button type="button" id="chip-art-before" style="padding:6px 10px;margin:2px;">+ Art before F${sf.isStart ? 0 : sf.id}</button><button type="button" id="chip-art-at" style="padding:6px 10px;margin:2px;">+ Art at F${sf.isStart ? 0 : sf.id}</button></div>` : '';
    ban.innerHTML = '<div>' + (li > 0 ? '‹ ' : '') + 'LEG ' + (li + 1) + ' of ' + legs.length + (editing ? ' – EDITING' : '') + (li < legs.length - 1 ? ' ›' : '') + '</div>'
      + `<div style="font-size:13px;font-weight:normal;margin:2px 0;">${hint}</div><div id="chip-row" style="overflow-x:auto;white-space:nowrap;">${chips}</div>${artBtns}`;
    ban.querySelectorAll('.flag-chip').forEach(b => b.onclick = () => {
      const f = currentLeg.flags[+b.dataset.i];
      selectedFlag = (selectedFlag === f) ? null : f;
      render();
      const card = legView.querySelector('.flag.selected');
      if (card) card.scrollIntoView({block: 'center', behavior: 'smooth'});
    });
    const ab = ban.querySelector('#chip-art-before'), aa = ban.querySelector('#chip-art-at');
    if (ab) ab.onclick = () => { const i = currentLeg.flags.indexOf(sf); openDesc('Article before this flag', d => placeArticle(i, d, false)); };
    const ad = ban.querySelector('#chip-art-del');
    if (ad) ad.onclick = () => { saveState(); sf.article = null; relabelArticles(); render(); drawMud(); };
    if (aa) aa.onclick = () => { const i = currentLeg.flags.indexOf(sf); openDesc('Article at this flag', d => placeArticle(i, d, true)); };
  }
  if (currentLeg.start) {
    const startDiv = document.createElement('div');
    startDiv.className = 'flag';
    startDiv.style.borderColor = '#4caf50';
    const label = currentLeg.start.type === 'gate' ? 'Flag 0 – START GATE (0m)' : 'Flag 0 – START (0m)';
    startDiv.innerHTML = `<strong>${label}</strong><div>${currentLeg.start.desc || '(tap to edit)'}</div>`;
    startDiv.onclick = () => openDesc(label + ' description', d => { currentLeg.start.desc = d; render(); }, currentLeg.start.desc || '');
    legView.appendChild(startDiv);
  }

  currentLeg.flags.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'flag' + (i === currentLeg.flags.length-1 ? ' active' : '') + (f === selectedFlag ? ' selected' : '');
    div.addEventListener('click', e => {
      if (e.target.closest('button, .bearing, .edit-art, input, textarea')) return;
      selectedFlag = (selectedFlag === f) ? null : f;
      render();
    });
    const label = f.isStart ? 'Flag 0 (0m)' : `Flag ${f.id} (${f.id * FLAG_M}m)`;
    const bearingField = f.isStart ? '' : `<div class="bearing" data-i="${i}">${f.bearing || ''}</div>`;
    const isLast = i === currentLeg.flags.length - 1;
    const ct = currentLeg.crossTracks.find(c => c.afterFlag === i);
    const dirButtons = (f.isStart || !isLast) ? (f.direction ? `<div>Leaving: <b>${f.direction}</b></div>` : '') : `
      <div class="dirs" data-i="${i}">
        <button data-dir="90L">90° L</button><button data-dir="90R">90° R</button>
        <button data-dir="obtL">Obtuse L</button><button data-dir="obtR">Obtuse R</button>
        ${allowAcute(level) ? '<button data-dir="acL">Acute L</button><button data-dir="acR">Acute R</button>' : ''}
      </div>
      ${f.direction ? `<div>Leaving: <b>${f.direction}</b></div>` : ''}`;
    div.innerHTML = `
      <strong>${label}</strong>${f === selectedFlag ? ' <span class="sel-note">SELECTED – −50m deletes it, +50m adds after it</span>' : ''}
      ${bearingField}
      ${dirButtons}
      ${f.article
        ? `<div class="article-mark edit-art" data-i="${i}">Article: ${f.article.desc} <button type="button" class="del-art" data-i="${i}">✕ delete</button></div>`
        : `<button type="button" class="add-art-before" data-i="${i}">+ Art before</button> <button type="button" class="add-art-at" data-i="${i}">+ Art at flag</button>`}
      <button type="button" class="drop-gps" data-i="${i}">📍 Drop GPS${f.gps ? ' ✓' : ''}</button>
      ${f.gps ? `<div style="font-size:12px;color:#8bc34a;">${f.gps.lat.toFixed(5)}, ${f.gps.lng.toFixed(5)}</div>` : ''}
      ${allowCross(level) ? (ct ? `<div class="cross-stub edit-cross" data-i="${i}">Cross: ${ct.desc} <button type="button" class="del-cross" data-i="${i}">✕</button></div>` : (crossTracksPlaced < R(level).crossCount ? `<button type="button" class="add-cross" data-i="${i}">+ Cross before</button>` : '')) : ''}
    `;
    legView.appendChild(div);
    if (ct) {
      const stub = document.createElement('div');
      stub.className = 'cross-stub';
      stub.innerHTML = `←${RULES.cross.armM}m X ${RULES.cross.armM}m→ (min ${RULES.cross.armMinM}m, ${RULES.cross.angleDeg}°)<br><small>${ct.desc}</small>`;
      legView.appendChild(stub);
    }
  });

  legView.querySelectorAll('.add-art-before').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const i = +btn.dataset.i;
      openDesc('Article before this flag', desc => placeArticle(i, desc, false));
    });
  });
  legView.querySelectorAll('.add-art-at').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const i = +btn.dataset.i;
      openDesc('Article at this flag', desc => placeArticle(i, desc, true));
    });
  });
  legView.querySelectorAll('.del-art').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const i = +btn.dataset.i;
      if (currentLeg.flags[i] && currentLeg.flags[i].article) {
        saveState();
        const wasStart = currentLeg.flags[i].isStart;
        currentLeg.flags[i].article = null;
        if (!wasStart) articlesPlaced = Math.max(0, articlesPlaced - 1);
        relabelArticles();
        render(); drawMud();
      }
    });
  });
  legView.querySelectorAll('.add-cross').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const i = +btn.dataset.i;
      if (crossTracksPlaced >= R(level).crossCount) return alert('This test has ' + R(level).crossCount + ' cross tracks on the whole track');
      openDesc('Cross track before this flag', desc => placeCross(i, desc));
    });
  });
  legView.querySelectorAll('.del-cross').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const i = +btn.dataset.i;
      saveState();
      currentLeg.crossTracks = currentLeg.crossTracks.filter(c => c.afterFlag !== i);
      crossTracksPlaced = Math.max(0, crossTracksPlaced - 1);
      render();
    });
  });
  legView.querySelectorAll('.drop-gps').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const i = +btn.dataset.i;
      if (!navigator.geolocation) return alert('GPS not available');
      btn.textContent = '📍 …';
      navigator.geolocation.getCurrentPosition(pos => {
        currentLeg.flags[i].gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) };
        render();
      }, err => {
        alert('GPS failed: ' + (err.message || 'denied'));
        render();
      }, { enableHighAccuracy: true, timeout: 12000 });
    });
  });
  legView.querySelectorAll('.edit-art').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      const i = +el.dataset.i; const a = currentLeg.flags[i].article; if (!a) return;
      const pre = a.label + ': ';
      const cur = a.desc.startsWith(pre) ? a.desc.slice(pre.length) : a.desc;
      openDesc('Edit article ' + a.label, d => { saveState(); a.desc = pre + d; render(); drawMud(); }, cur);
    });
  });
  legView.querySelectorAll('.edit-cross').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      const i = +el.dataset.i; const c = currentLeg.crossTracks.find(x => x.afterFlag === i); if (!c) return;
      openDesc('Edit cross track', d => { saveState(); c.desc = d; render(); }, c.desc || '');
    });
  });
  legView.querySelectorAll('.bearing').forEach(inp => {
    inp.onclick = e => {
      e.preventDefault();
      const i = +inp.dataset.i;
      openDesc('Bearing / aim point', desc => {
        setBearingFrom(currentLeg, i, desc);
        render();
      }, currentLeg.flags[i].bearing || '');
    };
    inp.readOnly = true;
  });
  legView.querySelectorAll('.dirs button').forEach(btn => {
    btn.onclick = e => {
      const i = +e.target.parentElement.dataset.i;
      const dir = e.target.dataset.dir;
      if (!setDirection(i, dir)) return; // refused: don't open the corner note or start a new leg
      if (i === currentLeg.flags.length - 1) {
        openDesc('Corner note', note => {
          currentLeg.flags[i].cornerNote = note || '';
          newLeg();
        });
      }
    };
  });

  const rules = R(level);
  const minL = rules.minLegs;
  const artNeed = rules.articles;
  const artLeft = Math.max(0, artNeed - articlesPlaced);
  const acuteNeed = rules.acutes;
  const acutesPlaced = countAcutes();
  const acuteLeft = Math.max(0, acuteNeed - acutesPlaced);
  const distNeed = rules.lengthM;
  const distNow = totalDist();
  const distLeft = Math.max(0, distNeed - distNow);
  const legsLabel = rules.maxLegs ? (legs.length + '/' + rules.maxLegs) : (legs.length + '/' + minL);
  const person = rules.person.charAt(0).toUpperCase() + rules.person.slice(1);
  let cheat = `TD${level} ${person} | Legs ${legsLabel} | Dist ${distNow}/${distNeed}m (${distLeft} left)<br>`;
  cheat += `Art ${articlesPlaced}/${artNeed} (${artLeft} left)`;
  if (rules.articlesIndicate) cheat += `, indicate ${rules.articlesIndicate}+`;
  if (acuteNeed > 0) cheat += ` | Acute ${acutesPlaced}/${acuteNeed} (${acuteLeft} left)`;
  cheat += ` | Age ${rules.ageMin}–${rules.ageMax} min`;
  if (rules.allowCross) {
    const need = rules.crossCount;
    const crossLeft = Math.max(0, need - crossTracksPlaced);
    cheat += `<br>Cross ${crossTracksPlaced}/${need} (${crossLeft} left)`;
    if (rules.crossNote) cheat += ` – ${rules.crossNote}`;
  }
  if (rules.allowDiversion) {
    const dv = legs.find(l => l.diversion);
    cheat += dv ? (' | Div ' + dv.diversion.side + ' (from start)') : (' | Div ready (V from start, min ' + RULES.diversion.minLengthM + 'm)');
  }
  if (rules.startArticleOnTrack) {
    const has = legs[0] && (legs[0].flags || []).some(f => f.isStart && f.article);
    if (!has) cheat += '<br>Start article needed';
  }
  if (rules.firstCornerMinM && legs[0] && legs.length < 2) {
    const n = legLength(legs[0]);
    if (n && n < rules.firstCornerMinM) cheat += `<br>First corner min ${rules.firstCornerMinM}m (this leg ${n}m)`;
  }
  cheat += `<br>Start: ${(legs[0]&&legs[0].start&&legs[0].start.desc)||'—'}`;
  statusEl.innerHTML = cheat;
  drawMud();
  bindButtons();
  setTimeout(() => {
    const active = legView.querySelector('.flag.active');
    if (active) active.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }, 30);
}

function getTurn(dir) {
  if (!dir) return 0;
  const left = dir.includes('L');
  if (dir.startsWith('90')) return left ? -Math.PI/2 : Math.PI/2;
  if (dir.startsWith('obt')) return left ? -Math.PI/3 : Math.PI/3;
  if (dir.startsWith('ac')) return left ? -2*Math.PI/3 : 2*Math.PI/3;
  return left ? -0.5 : 0.5;
}

function drawMud() {
  const c = mudmap;
  const w = c.width = Math.max(200, c.parentElement.clientWidth || 360);
  const h = c.height = 160;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, w, h);
  if (!legs || !legs.length) return;
  const f0 = legs[0].flags && legs[0].flags[0];
  const pts = [{ x: w / 2, y: h - 20, article: f0 && f0.isStart ? f0.article : null, atFlag: true }];
  let x = w / 2, y = h - 20, heading = -Math.PI / 2;
  legs.forEach((leg, li) => {
    (leg.flags || []).forEach((f, i) => {
      if (f.isStart) return;
      const prevX = x, prevY = y;
      x += Math.cos(heading) * 24;
      y += Math.sin(heading) * 24;
      pts.push({ x, y, prevX, prevY, article: f.article, atFlag: f.article && f.article.atFlag, cross: (leg.crossTracks || []).find(ct => ct.flagId === f.id || ct.afterFlag === i) });
    });
    if (li < legs.length - 1 && leg.exitDir) heading += getTurn(leg.exitDir);
  });
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });
  const spanX = maxX - minX || 1, spanY = maxY - minY || 1;
  const scale = Math.min((w - 24) / spanX, (h - 24) / spanY);
  const ox = (w - spanX * scale) / 2 - minX * scale;
  const oy = (h - spanY * scale) / 2 - minY * scale;
  const sp = pts.map(p => ({ x: p.x * scale + ox, y: p.y * scale + oy, prevX: p.prevX != null ? p.prevX * scale + ox : null, prevY: p.prevY != null ? p.prevY * scale + oy : null, article: p.article, atFlag: p.atFlag, cross: p.cross }));
  ctx.strokeStyle = '#ffeb3b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  sp.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.stroke();
  sp.forEach(p => {
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();
    if (p.article) {
      const mx = p.atFlag || p.prevX == null ? p.x : (p.prevX + p.x) / 2;
      const my = p.atFlag || p.prevY == null ? p.y : (p.prevY + p.y) / 2;
      ctx.fillStyle = '#ff5252';
      ctx.fillRect(mx - 4, my - 4, 8, 8);
    }
    if (p.cross && p.prevX != null) {
      const mx = (p.prevX + p.x) / 2, my = (p.prevY + p.y) / 2;
      const ang = Math.atan2(p.y - p.prevY, p.x - p.prevX) + Math.PI / 2;
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(mx + Math.cos(ang) * 16, my + Math.sin(ang) * 16);
      ctx.lineTo(mx - Math.cos(ang) * 16, my - Math.sin(ang) * 16);
      ctx.stroke();
    }
  });
}

function drawFullMap(pw, ph) {
  const w = fullcanvas.width = pw || window.innerWidth;
  const h = fullcanvas.height = ph || (window.innerHeight - 60);
  fctx.fillStyle = '#000'; fctx.fillRect(0,0,w,h);
  fctx.strokeStyle = '#ffeb3b'; fctx.lineWidth = 3;
  fctx.font = '14px sans-serif'; fctx.fillStyle = '#fff';
  // Collect points like mud map then rescale
  let points = [];
  let x = w/2, y = h - 40;
  let heading = -Math.PI/2;
  const st0 = legs[0] && legs[0].flags[0] && legs[0].flags[0].isStart ? legs[0].flags[0] : null;
  points.push({x, y, leg:0, flag:0, fo: st0, article: st0 && st0.article ? st0.article.desc : null, artLabel: st0 && st0.article ? st0.article.label || '' : '', articleAtFlag: true});
  legs.forEach((leg, li) => {
    const startIdx = leg.flags[0] && leg.flags[0].isStart ? 1 : 0;
    for (let i = startIdx; i < leg.flags.length; i++) {
      if (i === 0 && leg.flags[0].isStart) continue;
      const len = FLAG_M;
      const prevX = x, prevY = y;
      x += Math.cos(heading) * len;
      y += Math.sin(heading) * len;
      const midX = (prevX + x) / 2;
      const midY = (prevY + y) / 2;
      points.push({x, y, leg: li, flag: leg.flags[i].id, fo: leg.flags[i],
        article: leg.flags[i].article ? leg.flags[i].article.desc : null, artLabel: leg.flags[i].article ? leg.flags[i].article.label || '' : '',
        articleAtFlag: leg.flags[i].article ? !!leg.flags[i].article.atFlag : false,
        cross: leg.crossTracks.find(ct => (ct.flagId !== undefined && ct.flagId === leg.flags[i].id) || ct.afterFlag === i), 
        bearing: leg.flags[i].bearing,
        midX, midY,
        dir: leg.flags[i].direction,
        cornerNote: leg.flags[i].cornerNote || '',
        div: leg.diversion && leg.diversion.atFlag === leg.flags[i].id ? leg.diversion : null,
        prevBearing: i>0 ? (leg.flags[i-1].bearing || '') : ''});
    }
    if (li < legs.length - 1 && leg.exitDir) {
      heading += getTurn(leg.exitDir);
    }
  });
  if (points.length > 1) {
    let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
    points.forEach(p => { minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
    window.lastTrackExtent = [maxX-minX||1, maxY-minY||1];
    const scale = Math.min((w-160)/(maxX-minX||1), (h-160)/(maxY-minY||1));
    fmScale = scale || 1;
    const ox = (w - (maxX-minX)*scale)/2 - minX*scale;
    const oy = (h - (maxY-minY)*scale)/2 - minY*scale;
    points = points.map(p => ({
      ...p, 
      x: p.x*scale + ox, 
      y: p.y*scale + oy,
      midX: p.midX !== undefined ? p.midX*scale + ox : undefined,
      midY: p.midY !== undefined ? p.midY*scale + oy : undefined
    }));
  }
  // collision boxes: track dots + line samples, then each label as placed
  labelBoxes = []; labelHits = []; aimHits = []; artRings = [];
  const L0 = legs[0], LN = legs[legs.length - 1];
  points.forEach((p, k) => {
    labelBoxes.push({x: p.x - 9/mapScale, y: p.y - 9/mapScale, w: 18/mapScale, h: 18/mapScale});
    if (k) { const a = points[k-1]; const n = Math.ceil(Math.hypot(p.x-a.x, p.y-a.y) / (8/mapScale));
      for (let t = 1; t < n; t++) { const sx = a.x + (p.x-a.x)*t/n, sy = a.y + (p.y-a.y)*t/n;
        labelBoxes.push({x: sx - 3/mapScale, y: sy - 3/mapScale, w: 6/mapScale, h: 6/mapScale}); } }
  });
  fctx.save();
  fctx.translate(mapTx, mapTy);
  fctx.scale(mapScale, mapScale);
  fctx.lineWidth = 3 / mapScale;
  fctx.font = (14 / mapScale) + 'px sans-serif';
  fctx.beginPath();
  points.forEach((p,i) => { if(i===0) fctx.moveTo(p.x,p.y); else fctx.lineTo(p.x,p.y); });
  fctx.stroke();
  // diversion: 30° off the first leg from the start flag, ~70 m long
  const dvLeg = legs.find(l => l.diversion);
  if (dvLeg && points.length > 1) [points[0]].forEach(p => {
    p = Object.assign({}, p, {div: dvLeg.diversion});
    const q = points[1];
    const seg = Math.hypot(q.x - p.x, q.y - p.y) || 40;
    const baseAng = Math.atan2(q.y - p.y, q.x - p.x);
    const ang = baseAng + (p.div.side === 'L' ? -1 : 1) * RULES.diversion.angleDeg * Math.PI/180;
    const len = Math.max(seg * (RULES.diversion.lengthM / FLAG_M), 85 / mapScale); // plotted diversion length, min size so it stands out
    const ex = p.x + Math.cos(ang)*len, ey = p.y + Math.sin(ang)*len;
    fctx.strokeStyle = '#ff9800'; fctx.lineWidth = 3 / mapScale;
    fctx.setLineDash([10/mapScale, 6/mapScale]);
    fctx.beginPath(); fctx.moveTo(p.x, p.y); fctx.lineTo(ex, ey); fctx.stroke();
    fctx.setLineDash([]);
    // arrow head
    fctx.beginPath();
    fctx.moveTo(ex, ey);
    fctx.lineTo(ex - Math.cos(ang - 0.4)*12/mapScale, ey - Math.sin(ang - 0.4)*12/mapScale);
    fctx.moveTo(ex, ey);
    fctx.lineTo(ex - Math.cos(ang + 0.4)*12/mapScale, ey - Math.sin(ang + 0.4)*12/mapScale);
    fctx.stroke();
    fctx.fillStyle = '#ff9800'; fctx.font = 'bold ' + (13/mapScale) + 'px sans-serif';
    wrapText('DIVERSION ' + (p.div.side === 'L' ? 'LEFT' : 'RIGHT') + (p.div.desc ? ': ' + p.div.desc : ''), ex + 6/mapScale, ey + 4/mapScale, {o: L0, k: 'div'});
    fctx.strokeStyle = '#ffeb3b';
  });
  if (R(level).startType === 'gate' && points.length > 1) {
    const s = points[0];
    const n = points[1];
    const baseAng = Math.atan2(n.y - s.y, n.x - s.x);
    const gateAng = baseAng + Math.PI/2;
    const glen = 20 / mapScale;
    fctx.strokeStyle = '#4caf50';
    fctx.lineWidth = 4 / mapScale;
    fctx.beginPath();
    fctx.moveTo(s.x - Math.cos(gateAng)*glen, s.y - Math.sin(gateAng)*glen);
    fctx.lineTo(s.x + Math.cos(gateAng)*glen, s.y + Math.sin(gateAng)*glen);
    fctx.stroke();
    fctx.fillStyle = '#4caf50';
    fctx.font = (11/mapScale) + 'px sans-serif';
    wrapText('GATE ' + RULES.gateWidthM + 'm', s.x + 8/mapScale, s.y + 14/mapScale, {o: L0, k: 'gate'});
    fctx.strokeStyle = '#ffeb3b';
  }
  if (legs[0] && legs[0].start && legs[0].start.desc && points.length > 0) {
    fctx.fillStyle = '#4caf50';
    fctx.font = '14px sans-serif';
    wrapText('START: ' + legs[0].start.desc, points[0].x + 10, points[0].y + 20, {o: L0, k: 'start'});
  }
  if (!R(level).startArticleOnTrack && points.length > 0) {
    // TD7-10: judge holds the start article in a sealed scent bag
    fctx.fillStyle = '#ffffff';
    fctx.font = 'italic bold ' + (13/mapScale) + 'px sans-serif';
    wrapText('Start article: sealed bag (judge)', points[0].x + 10/mapScale, points[0].y + 38/mapScale, {o: L0, k: 'bag'});
  }
  if (hideDesc && points.length > 0) {
    const last = points[points.length-1];
    fctx.fillStyle = '#ffff00';
    fctx.font = 'bold ' + (16/mapScale) + 'px sans-serif';
    wrapText('HIDE: ' + hideDesc, last.x + 20/mapScale, last.y - 35/mapScale, {o: LN, k: 'hide'});
  }
  points.forEach((p, idx) => {
    const newAim = !!(p.bearing && p.bearing !== p.prevBearing && p.fo);
    fctx.fillStyle = '#ffeb3b';
    fctx.beginPath(); fctx.arc(p.x, p.y, 7/mapScale, 0, Math.PI*2); fctx.fill();
    let ringR = 0; // v7.6: radius of an article ring sitting on this flag (aim arrow base touches it)
    if (p.article) {
      // v7.6 article rings: label (A0, A1...) inside a white ring, description adjacent
      const useMid = !p.articleAtFlag && p.midX !== undefined;
      const RR = 16 / mapScale, lab = p.artLabel || (String(p.article).match(/^A\d+/) || [''])[0];
      const descTxt = String(p.article).replace(/^A\d+:\s*/, '');
      const aref = {o: p.fo || L0, k: 'art'};
      const prev = points[Math.max(0, idx-1)] || p;
      const horiz = Math.abs(p.x - prev.x) > Math.abs(p.y - prev.y);
      let cx = p.x, cy = p.y;
      if (useMid) {
        const dx0 = p.midX, dy0 = p.midY;
        // true position: small white dot on the track
        fctx.fillStyle = '#fff'; fctx.beginPath(); fctx.arc(dx0, dy0, 3.5/mapScale, 0, Math.PI*2); fctx.fill(); // art-dot
        const o = getLblOff(aref);
        if (o) { cx = dx0 + o[0]; cy = dy0 + o[1]; }
        else {
          const ang = Math.atan2(p.y - prev.y, p.x - prev.x) + Math.PI/2, D = 46 / mapScale;
          const vx0 = -mapTx / mapScale, vy0 = -mapTy / mapScale, vx1 = (fullcanvas.width - mapTx) / mapScale, vy1 = (fullcanvas.height - mapTy) / mapScale;
          const cand = [1, -1].map(sg => [dx0 + Math.cos(ang)*D*sg, dy0 + Math.sin(ang)*D*sg]);
          const okc = c => { const bx = {x: c[0]-RR-2, y: c[1]-RR-2, w: 2*RR+4, h: 2*RR+4};
            return bx.x >= vx0 && bx.y >= vy0 && bx.x + bx.w <= vx1 && bx.y + bx.h <= vy1 && !boxHit(bx); };
          const c = cand.find(okc) || cand[0]; cx = c[0]; cy = c[1];
        }
        // thin dashed white leader from the dot to the ring edge
        const L = Math.hypot(cx - dx0, cy - dy0) || 1;
        if (L > RR) {
          fctx.strokeStyle = '#fff'; fctx.lineWidth = 1.5 / mapScale; fctx.setLineDash([4/mapScale, 3/mapScale]);
          fctx.beginPath(); fctx.moveTo(dx0, dy0); fctx.lineTo(cx - (cx-dx0)/L*RR, cy - (cy-dy0)/L*RR); fctx.stroke(); // art-leader
          fctx.setLineDash([]);
        }
      }
      // the ring itself, filled with map background
      fctx.fillStyle = '#000'; fctx.strokeStyle = '#fff'; fctx.lineWidth = 2.5 / mapScale;
      fctx.beginPath(); fctx.arc(cx, cy, RR, 0, Math.PI*2); fctx.fill(); fctx.stroke(); // art-ring
      fctx.fillStyle = '#fff'; fctx.font = 'bold ' + (12/mapScale) + 'px sans-serif';
      fctx.textAlign = 'center'; fctx.textBaseline = 'middle'; fctx.fillText(lab, cx, cy);
      fctx.textAlign = 'left'; fctx.textBaseline = 'alphabetic';
      const ringBox = {x: cx - RR - 2/mapScale, y: cy - RR - 2/mapScale, w: 2*RR + 4/mapScale, h: 2*RR + 4/mapScale};
      labelBoxes.push(ringBox);
      artRings.push({p, cx, cy, r: RR, atFlag: !useMid});
      if (!useMid) ringR = RR;
      fctx.font = 'bold ' + (13/mapScale) + 'px sans-serif';
      const off = RR + 6 / mapScale;
      if (useMid) {
        // ring + description move together (offset = ring centre relative to the track dot)
        const cur = [cx - p.midX, cy - p.midY];
        labelHits.push({ref: aref, cur, box: ringBox});
        if (descTxt) {
          if (horiz && !printMode) placeLinesRot(wrapLines(descTxt), cx + 4/mapScale, cy - off);
          else placeLines(wrapLines(descTxt), cx + off, cy + 4/mapScale);
          labelHits.push({ref: aref, cur, box: labelBoxes[labelBoxes.length - 1]});
        }
      } else if (descTxt) {
        if (horiz && !printMode) placeLinesRot(wrapLines(descTxt), cx + 4/mapScale, cy - off, aref);
        else wrapText(descTxt, cx + off, cy + 4/mapScale, aref);
      }
    }
    if (p.cross) {
      const mx = p.midX !== undefined ? p.midX : p.x;
      const my = p.midY !== undefined ? p.midY : p.y;
      fctx.strokeStyle='#00e5ff'; 
      fctx.lineWidth=4 / mapScale;
      const prev = points[Math.max(0, idx-1)] || p;
      const ang = Math.atan2(p.y - prev.y, p.x - prev.x) + Math.PI/2;
      fctx.beginPath();
      fctx.moveTo(mx + Math.cos(ang)*36/mapScale, my + Math.sin(ang)*36/mapScale);
      fctx.lineTo(mx - Math.cos(ang)*36/mapScale, my - Math.sin(ang)*36/mapScale);
      fctx.stroke();
      fctx.strokeStyle='#ffeb3b';
      if (p.cross.desc) wrapText(p.cross.desc, mx+8/mapScale, my+14/mapScale, {o: p.fo || L0, k: 'cross'});
    }
    if (newAim) {
      // v7.5 aim vector: engineering-dimension arrowhead (filled narrow triangle) at the flag, pointing along the new bearing
      // v7.6b: arrow sits just BEFORE the flag on the incoming segment, pointing INTO the flag,
      // tip touching the flag dot / article ring edge. No incoming segment (track start): after the flag.
      const nx = points[idx+1], pv = idx > 0 ? points[idx-1] : null;
      const AL = 40 / mapScale, AW = 7 / mapScale;
      const RB = (ringR ? ringR + 1.25 / mapScale : 7 / mapScale);
      let ux, uy, bx0, by0, tx0, ty0;
      if (pv && (pv.x !== p.x || pv.y !== p.y)) {
        const a0 = Math.atan2(p.y - pv.y, p.x - pv.x); ux = Math.cos(a0); uy = Math.sin(a0);
        tx0 = p.x - ux*RB; ty0 = p.y - uy*RB; bx0 = tx0 - ux*AL; by0 = ty0 - uy*AL;
      } else {
        const a0 = nx ? Math.atan2(nx.y - p.y, nx.x - p.x) : -Math.PI/2; ux = Math.cos(a0); uy = Math.sin(a0);
        bx0 = p.x + ux*RB; by0 = p.y + uy*RB; tx0 = bx0 + ux*AL; ty0 = by0 + uy*AL;
      }
      fctx.fillStyle = '#fff';
      fctx.beginPath(); // aim-arrow-in
      fctx.moveTo(tx0, ty0);
      fctx.lineTo(bx0 - uy*AW, by0 + ux*AW);
      fctx.lineTo(bx0 + uy*AW, by0 - ux*AW);
      fctx.closePath(); fctx.fill();
      aimHits.push({p, cx: (bx0 + tx0)/2, cy: (by0 + ty0)/2, bx: bx0, by: by0, tx: tx0, ty: ty0, rb: RB});
      fctx.fillStyle = '#fff'; // aim text same colour as the arrow, slightly smaller than flag labels
      fctx.font = 'bold ' + (12/mapScale) + 'px sans-serif';
      const prev = points[Math.max(0, idx-1)] || p;
      const horiz = Math.abs(p.x - prev.x) > Math.abs(p.y - prev.y);
      const off = 28 / mapScale;
      const aref = {o: p.fo, k: 'aim', p};
      if (horiz && !printMode) {
        placeLinesRot(wrapLines(p.bearing), p.x, p.y - off, aref);
      } else {
        wrapText(p.bearing, p.x + off, p.y - off/2, aref);
      }
      fctx.strokeStyle = '#ffeb3b';
    }
    // Distance + cumulative at end of every leg (including final)
    const isEndOfLeg = p.dir || (idx === points.length - 1) || (idx < points.length - 1 && points[idx+1].leg !== p.leg);
    if (isEndOfLeg && p.leg !== undefined) {
      const legMeters = legLength(legs[p.leg]);
      let cum = 0;
      for (let k = 0; k <= p.leg; k++) {
        cum += legLength(legs[k]);
      }
      fctx.fillStyle = '#ffeb3b';
      fctx.font = (12/mapScale) + 'px sans-serif';
      const prev = points[Math.max(0, idx-1)] || p;
      const next = points[Math.min(points.length-1, idx+1)] || p;
      // Offset to the outside of the corner (away from both segments)
      const inAng = Math.atan2(p.y - prev.y, p.x - prev.x);
      const outAng = Math.atan2(next.y - p.y, next.x - p.x);
      let bisect = (inAng + outAng) / 2 + Math.PI/2;
      // Prefer the side with more open space (away from track)
      const testOff = 40 / mapScale;
      const side1x = p.x + Math.cos(bisect) * testOff;
      const side1y = p.y + Math.sin(bisect) * testOff;
      const side2x = p.x - Math.cos(bisect) * testOff;
      const side2y = p.y - Math.sin(bisect) * testOff;
      // Choose side farther from the midpoint of the track
      const midTrackX = (prev.x + next.x) / 2;
      const midTrackY = (prev.y + next.y) / 2;
      const d1 = Math.hypot(side1x - midTrackX, side1y - midTrackY);
      const d2 = Math.hypot(side2x - midTrackX, side2y - midTrackY);
      const useSide = d1 > d2 ? 1 : -1;
      const ox = p.x + Math.cos(bisect) * useSide * (42 / mapScale);
      const oy = p.y + Math.sin(bisect) * useSide * (42 / mapScale);
      const distTxt = legMeters + 'm (' + cum + 'm)';
      const noteTxt = p.cornerNote || '';
      fctx.textAlign = 'center';
      placeLines((noteTxt ? wrapLines(noteTxt) : []).concat([distTxt]), ox, oy, p.fo ? {o: p.fo, k: 'dist'} : null);
      fctx.textAlign = 'left';
    }
  });
  fctx.restore();
  fullcanvas.onclick = e => {
    const rect = fullcanvas.getBoundingClientRect();
    let mx = e.clientX - rect.left;
    let my = e.clientY - rect.top;
    mx = (mx - mapTx) / (mapScale || 1);
    my = (my - mapTy) / (mapScale || 1);
    if (moveLabels) return; // v7.5: taps do nothing while moving labels
    // v7.5: tap an aim arrow or its description -> bearing / aim editor
    let aimP = null;
    for (const h of labelHits) if (h.ref.k === 'aim' && mx >= h.box.x && mx <= h.box.x + h.box.w && my >= h.box.y && my <= h.box.y + h.box.h) aimP = h.ref.p;
    if (!aimP) for (const a of aimHits) if (!a.p.dir && Math.hypot(mx - a.cx, my - a.cy) < 16 / (mapScale || 1)) aimP = a.p;
    if (aimP && legs[aimP.leg]) {
      const leg = legs[aimP.leg], flag = aimP.fo, fIdx = leg.flags.indexOf(flag);
      if (fIdx >= 0) {
        document.getElementById('fullmap').classList.remove('show');
        document.body.style.overflow = '';
        currentLeg = leg; selectedFlag = flag;
        const bar = document.getElementById('dir-bar'); if (bar) bar.innerHTML = '';
        openDesc('Bearing / aim point from Flag ' + flag.id + ' to end of leg', desc => {
          saveState();
          setBearingFrom(leg, fIdx, desc);
          render(); drawMud(); drawFullMap();
          document.getElementById('fullmap').classList.add('show');
        }, flag.bearing || '');
        return;
      }
    }
    // Prefer flag hit for corner edit
    let bestFlag = null, bestFlagD = 28;
    for (let p of points) {
      if (p.leg === undefined) continue;
      const d = Math.hypot(mx - p.x, my - p.y);
      if (d < bestFlagD) {
        bestFlagD = d;
        bestFlag = p;
      }
    }
    if (bestFlag) {
      const leg = legs[bestFlag.leg];
      const flag = leg.flags.find(f => f.id === bestFlag.flag) || leg.flags[leg.flags.length-1];
      document.getElementById('fullmap').classList.remove('show');

        + `<button type="button" id="bar-bearing" style="background:#ffeb3b;color:#000;padding:8px;">Bearing</button>`;
      bar.querySelector('#bar-bearing').onclick = editBearing;

    }

}

let mapScale = 1, mapTx = 0, mapTy = 0;
function setupMapGestures() {
  const el = document.getElementById('fullcanvas');
  let lastDist = 0, lastX = 0, lastY = 0, dragging = false;
  // v7.5: label drag (Move labels on). A grabbed label takes the gesture so panning never fights it.
  let lblDrag = null;
  const toMap = (cx, cy) => { const r = el.getBoundingClientRect(); return [(cx - r.left - mapTx) / (mapScale || 1), (cy - r.top - mapTy) / (mapScale || 1)]; };
  const grabLabel = (cx, cy) => {
    if (!moveLabels) return false;
    const [mx, my] = toMap(cx, cy), pad = 6 / (mapScale || 1);
    for (let i = labelHits.length - 1; i >= 0; i--) {
      const h = labelHits[i], b = h.box;
      if (mx >= b.x - pad && mx <= b.x + b.w + pad && my >= b.y - pad && my <= b.y + b.h + pad) {

        return true;

    }

  };
  const moveLabel = (cx, cy) => {
    const [mx, my] = toMap(cx, cy), d = lblDrag;
    const r2 = v => Math.round(v * 100) / 100;
    d.o.lblOff = d.o.lblOff || {};
    d.o.lblOff[d.k] = [r2((d.cur[0] + mx - d.mx) / fmScale), r2((d.cur[1] + my - d.my) / fmScale)];
    drawFullMap();
  };
  const dropLabel = () => { lblDrag = null; autoSave(); };
  el.onmousedown = e => { if (grabLabel(e.clientX, e.clientY)) e.preventDefault(); };
  window.addEventListener('mousemove', e => { if (lblDrag) moveLabel(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if (lblDrag) dropLabel(); });

    if (e.touches.length === 1 && grabLabel(e.touches[0].clientX, e.touches[0].clientY)) { dragging = false; return; }
    if (lblDrag && e.touches.length > 1) dropLabel();
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastDist = Math.hypot(dx, dy);
    } else if (e.touches.length === 1) {
      dragging = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }
  };
  el.ontouchmove = e => {
    e.preventDefault();
    if (lblDrag) { if (e.touches.length === 1) moveLabel(e.touches[0].clientX, e.touches[0].clientY); return; }
    if (e.touches.length === 2 && lastDist) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      mapScale = Math.max(0.5, Math.min(4, mapScale * (dist / lastDist)));
      lastDist = dist;
      drawFullMap();
    } else if (e.touches.length === 1 && dragging && mapScale > 1) {
      mapTx += e.touches[0].clientX - lastX;
      mapTy += e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      drawFullMap();
    }
  };
  el.ontouchend = e => {

    if (moveLabels) return;
    if (e.changedTouches && e.changedTouches.length === 1 && mapScale <= 1.1) {

}

// ---- Dictation v2: ONE continuous SpeechRecognition session shared by all popups ----
// iOS Safari refuses to restart recognition soon after a stop/abort, so we never stop it
// between popups. We just switch "capture" on/off; results go to whichever popup is open.
let recognition = null;

let capturing = false;      // user wants text in the current popup
let dictBase = '';
let capturedFrom = 0;       // result index where this capture began

function setDictUI(on, msg) {
  const btn = document.getElementById('dictate-btn');
  const status = document.getElementById('dictate-status');
  if (btn) {
    btn.textContent = on ? '⏹ Stop' : '🎤 Dictate';
    btn.style.background = on ? '#4caf50' : '#ff5252';
  }
  if (status) status.textContent = msg || '';
}

function getRecognizer() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;

  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = 'en-AU';
  r.onstart = () => { recRunning = true; if (capturing) setDictUI(true, 'Listening…'); };
  r.onresult = e => {
    lastLen = e.results.length;
    if (!capturing) return;
    const input = document.getElementById('desc-input');
    let txt = '';
    for (let i = capturedFrom; i < e.results.length; i++) txt += e.results[i][0].transcript;
    input.value = (dictBase + txt).replace(/\s+/g, ' ').trimStart();
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') dictMsg = 'Allow mic in Settings';
    else if (e.error === 'no-speech' || e.error === 'aborted') dictMsg = '';
    else dictMsg = 'Tap Dictate again';
  };
  r.onend = () => {
    recRunning = false;
    capturedFrom = 0;
    lastLen = 0;
    if (capturing) { capturing = false; setDictUI(false, dictMsg || 'Mic paused – tap Dictate'); }
    dictMsg = '';
  };
  recognition = r;
  return r;
}

function startCapture() {
  const input = document.getElementById('desc-input');
  dictBase = input.value.trim() ? input.value.trim() + ' ' : '';
  capturedFrom = recRunning ? lastLen : 0;
  capturing = true;
  setDictUI(true, recRunning ? 'Listening…' : 'Starting…');
}

// Leave the engine running; just stop putting text into the popup.
function stopDictation() {
  if (!capturing) return;
  capturing = false;
  const input = document.getElementById('desc-input');
  if (input) input.value = input.value.trim();
  setDictUI(false, '');
}

function setupDictate() {
  const btn = document.getElementById('dictate-btn');
  const input = document.getElementById('desc-input');
  btn.onclick = () => {
    const r = getRecognizer();
    if (!r) { input.focus(); setDictUI(false, 'Use keyboard mic'); return; }
    if (capturing) { stopDictation(); return; }
    startCapture();
    if (!recRunning) {
      try { r.start(); }            // inside the tap, same instance every time
      catch (err) {                 // already starting/running: just keep capturing
        if (err && err.name !== 'InvalidStateError') { capturing = false; setDictUI(false, 'Tap Dictate again'); }
      }
    }
  };
}

function wrapLines(text) {
