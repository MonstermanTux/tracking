  if (!trackDone) return alert('Finish the track first');
  ['dog','comp','judge','steward'].forEach(k => { document.getElementById('pdf-' + k).value = localStorage.getItem('pdf-' + k) || ''; });
  const dt = document.getElementById('pdf-date'); if (!dt.value) dt.value = new Date().toISOString().slice(0, 10);
  document.getElementById('pdf-modal').classList.add('show');
};
document.getElementById('pdf-cancel').onclick = () => document.getElementById('pdf-modal').classList.remove('show');
document.getElementById('pdf-make').onclick = async () => {
  const info = {};
  ['dog','comp','judge','steward'].forEach(k => { info[k] = document.getElementById('pdf-' + k).value.trim(); localStorage.setItem('pdf-' + k, info[k]); });
  const dv = document.getElementById('pdf-date').value;
  info.date = dv ? dv.split('-').reverse().join('/') : '';
  document.getElementById('pdf-modal').classList.remove('show');
  const blob = makeTrackPdf(info);
  const name = 'Tracking-TD' + level + (info.dog ? '-' + info.dog.replace(/[^\w-]+/g, '_') : '') + (dv ? '-' + dv : '') + '.pdf';
  const file = new File([blob], name, { type: 'application/pdf' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
};

bindButtons();
document.getElementById('undo').onclick = undo;
document.getElementById('view-map').onclick = () => {
  document.body.style.overflow = 'hidden';
  drawFullMap();
  document.getElementById('fullmap').classList.add('show');
};
mudmap.onclick = () => {
  document.body.style.overflow = 'hidden';
  drawFullMap();
  document.getElementById('fullmap').classList.add('show');
};
document.getElementById('close-fullmap').onclick = () => {
  document.body.style.overflow = '';
  document.getElementById('fullmap').classList.remove('show');
};
document.getElementById('recentre-btn').onclick = () => {
  mapScale = 1; mapTx = 0; mapTy = 0; drawFullMap();
};
if (document.getElementById('article-btn')) document.getElementById('article-btn').onclick = () => {
  if (!currentLeg) return;
  openDesc('Article before flag (midway)', desc => placeArticle(currentLeg.flags.length-1, desc, false));
};
if (document.getElementById('article-at-btn')) document.getElementById('article-at-btn').onclick = () => {
  if (!currentLeg) return;
  openDesc('Article at flag', desc => placeArticle(currentLeg.flags.length-1, desc, true));
};
document.getElementById('div-l-btn').onclick = () => {
  if (!allowDiversion(level)) return;
  openDesc('Diversion left note', desc => { saveState(); currentLeg.diversion = {side:'L', desc, atFlag: currentLeg.flags[currentLeg.flags.length-1].id}; diversion = currentLeg.diversion; render(); });
};
document.getElementById('div-r-btn').onclick = () => {
  if (!allowDiversion(level)) return;
  openDesc('Diversion right note', desc => { saveState(); currentLeg.diversion = {side:'R', desc, atFlag: currentLeg.flags[currentLeg.flags.length-1].id}; diversion = currentLeg.diversion; render(); });
};

levelEl.onchange = () => {
  if (confirm('Change level and restart?')) {
    level = parseInt(levelEl.value);
    legs = []; currentLeg = null; articlesPlaced = 0; crossTracksPlaced = 0; history = [];
    newLeg();
  }
};
// ===== running save: reopen the last track after a crash or swipe-away =====
document.addEventListener('visibilitychange', () => { if (document.hidden) autoSave(); });
window.addEventListener('pagehide', autoSave);
document.getElementById('new-track').onclick = () => {
  if (!confirm('Save this track and start a new one?')) return;
  autoSave();
  try {
    const cur = localStorage.getItem('tracking-autosave');
    if (cur) {
      const saved = JSON.parse(localStorage.getItem('tracking-saved') || '[]');
      saved.push(JSON.parse(cur));
      while (saved.length > 30) saved.shift(); // keep last 30 tracks
      localStorage.setItem('tracking-saved', JSON.stringify(saved));
    }
  } catch (e) { if (!confirm('Could not save (' + e.message + '). Start new anyway?')) return; }
  localStorage.removeItem('tracking-autosave');
  legs = []; currentLeg = null; articlesPlaced = 0; crossTracksPlaced = 0; history = []; hideDesc = ''; diversion = null;
  setTrackDone(false);
  document.getElementById('fullmap').classList.remove('show');
  document.getElementById('start-page').style.display = 'flex';
};
let restored = null;
try { restored = JSON.parse(localStorage.getItem('tracking-autosave') || 'null'); } catch (e) {}
if (restored && restored.legs && restored.legs.length) {
  level = restored.level; levelEl.value = level;
  legs = restored.legs; currentLeg = legs[legs.length-1];
  articlesPlaced = restored.articlesPlaced || 0; crossTracksPlaced = restored.crossTracksPlaced || 0;
  hideDesc = restored.hideDesc || ''; diversion = (legs.find(l => l.diversion) || {}).diversion || null;
  document.getElementById('start-page').style.display = 'none';
  render();
  saveState();
  setTrackDone(!!restored.trackDone);
  const tm = new Date(restored.t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
  setTimeout(() => { statusEl.innerHTML = 'Restored saved track (' + tm + ')<br>' + statusEl.innerHTML; }, 50);
} else {
  render();
  saveState();
}
bindButtons();

// v6.9: swipe the leg page right = previous leg, left = next leg
function gotoLeg(d) {
  const li = legs.indexOf(currentLeg), ni = li + d;
  if (li < 0 || ni < 0 || ni >= legs.length) return false;
  currentLeg = legs[ni]; selectedFlag = null; render();
  window.scrollTo({top: 0});
  return true;
}
(() => {
  let sx = 0, sy = 0, ok = false;
  const start = e => {
    const t = e.touches[0];
    ok = e.touches.length === 1 && !e.target.closest('textarea, input, .flag-chip, #chip-row');
    sx = t.clientX; sy = t.clientY;
  };
  const end = e => {
    if (!ok) return; ok = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 70 || Math.abs(dx) < 2 * Math.abs(dy)) return;
    if (document.querySelector('#desc-modal.show, #fullmap.show')) return;
    gotoLeg(dx > 0 ? -1 : 1);
  };
  ['leg-view', 'leg-banner'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', start, {passive: true});
    el.addEventListener('touchend', end, {passive: true});
  });
})();

// v7.0: load a saved track (current track is saved to the list first)
function stashCurrent() {
  autoSave();
  const cur = localStorage.getItem('tracking-autosave');
  if (!cur || !legs.length) return;
  const saved = JSON.parse(localStorage.getItem('tracking-saved') || '[]');
  saved.push(JSON.parse(cur));
  while (saved.length > 30) saved.shift();
  localStorage.setItem('tracking-saved', JSON.stringify(saved));
}
function openLoad() {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem('tracking-saved') || '[]'); } catch (e) {}
  const list = document.getElementById('load-list');
  if (!saved.length) list.innerHTML = '<p>No saved tracks yet. Save &amp; New stores them here.</p>';
  else list.innerHTML = saved.map((t, i) => ({t, i})).reverse().map(({t, i}) => {
    const d = new Date(t.t), fl = (t.legs || []).reduce((n, l) => n + Math.max(0, (l.flags || []).length - (l.flags && l.flags[0] && l.flags[0].isStart ? 1 : 0)), 0);
    const when = d.toLocaleDateString([], {day: 'numeric', month: 'short', year: 'numeric'}) + ' ' + d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
    return `<div style="display:flex;gap:6px;margin:4px 0;"><button type="button" class="load-item" data-i="${i}" style="flex:1;text-align:left;padding:10px;">TD${t.level} · ${(t.legs || []).length} legs · ${fl * FLAG_M}m<br><small>${when}${t.trackDone ? ' · finished' : ''}</small></button><button type="button" class="load-exp" data-i="${i}" style="padding:10px;">📤</button><button type="button" class="load-del" data-i="${i}" style="background:#f44336;color:#fff;padding:10px;">🗑</button></div>`;
  }).join('');
  list.querySelectorAll('.load-item').forEach(b => b.onclick = () => loadSaved(+b.dataset.i));
  list.querySelectorAll('.load-exp').forEach(b => b.onclick = () => {
    const sv = JSON.parse(localStorage.getItem('tracking-saved') || '[]');
    if (sv[+b.dataset.i]) exportTrack(sv[+b.dataset.i]);
  });
  list.querySelectorAll('.load-del').forEach(b => b.onclick = () => {
    if (!confirm('Delete this saved track? This cannot be undone.')) return;
    const sv = JSON.parse(localStorage.getItem('tracking-saved') || '[]');
    sv.splice(+b.dataset.i, 1);
    localStorage.setItem('tracking-saved', JSON.stringify(sv));
    openLoad();
  });
  document.getElementById('load-modal').classList.add('show');
}
function loadSaved(i) {
  try {
    if (legs.length && !confirm('Save the current track to the list and open this one?')) return;
    stashCurrent();
    const saved = JSON.parse(localStorage.getItem('tracking-saved') || '[]');
    const idx = legs.length ? i : i; // index unaffected: stash appends at the end
    const t = saved.splice(idx, 1)[0];
    if (!t) return;
    localStorage.setItem('tracking-saved', JSON.stringify(saved));
    level = t.level; levelEl.value = level;
    legs = t.legs; currentLeg = legs[legs.length - 1];
    articlesPlaced = t.articlesPlaced || 0; crossTracksPlaced = t.crossTracksPlaced || 0;
    hideDesc = t.hideDesc || ''; diversion = (legs.find(l => l.diversion) || {}).diversion || null;
    history = []; selectedFlag = null;
    document.getElementById('load-modal').classList.remove('show');
    document.getElementById('fullmap').classList.remove('show');
    document.getElementById('start-page').style.display = 'none';
    render(); saveState(); setTrackDone(!!t.trackDone); drawMud(); autoSave();
  } catch (e) { alert('Could not load: ' + e.message); }
}
document.getElementById('load-btn').onclick = openLoad;
document.getElementById('load-btn2').onclick = openLoad;
document.getElementById('load-cancel').onclick = () => document.getElementById('load-modal').classList.remove('show');
document.getElementById('new-nosave').onclick = () => {
  if (legs.length && !confirm('Start a new track WITHOUT saving this one? It will be lost.')) return;
  localStorage.removeItem('tracking-autosave');
  legs = []; currentLeg = null; articlesPlaced = 0; crossTracksPlaced = 0; history = []; hideDesc = ''; diversion = null; selectedFlag = null;
  setTrackDone(false);
  document.getElementById('fullmap').classList.remove('show');
  document.getElementById('start-page').style.display = 'flex';
};

// v7.2: export/import in a fixed, versioned file format (see FORMAT below)
// FORMAT v1: {"format":"tracking-track","formatVersion":1,"appVersion":"7.2","exported":ISO,
//   "track":{level,legs,articlesPlaced,crossTracksPlaced,hideDesc,trackDone,t}}
// Future versions must keep reading formatVersion 1 files.
// v7.5 optional (still format v1): flag.lblOff / leg.lblOff = {key:[dx,dy]} moved-label offsets; absent = auto placement.
const TRACK_FORMAT = 'tracking-track', TRACK_FORMAT_VERSION = 1, APP_VERSION = '7.6';
async function exportTrack(t) {
  const d = new Date(t.t || Date.now()), pad = n => String(n).padStart(2, '0');
  const name = `TD${t.level}-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  const body = JSON.stringify({format: TRACK_FORMAT, formatVersion: TRACK_FORMAT_VERSION, appVersion: APP_VERSION, exported: new Date().toISOString(), track: t}, null, 1);
  const file = new File([body], name, {type: 'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importTrackText(txt) {
  const o = JSON.parse(txt);
  if (!o || o.format !== TRACK_FORMAT || !o.track) throw new Error('not a Tracking export file');
  if (o.formatVersion > TRACK_FORMAT_VERSION) throw new Error('file is from a newer app version (format ' + o.formatVersion + '); update the app');
  const t = o.track;
  if (!Array.isArray(t.legs) || !t.legs.length || !t.level) throw new Error('file has no track data');
  const sv = JSON.parse(localStorage.getItem('tracking-saved') || '[]');
  sv.push(t); while (sv.length > 30) sv.shift();
  localStorage.setItem('tracking-saved', JSON.stringify(sv));
}
document.getElementById('export-btn').onclick = () => {
  if (!legs.length) { alert('No track to export.'); return; }
  autoSave();
  exportTrack(JSON.parse(localStorage.getItem('tracking-autosave')));
};
document.getElementById('import-btn').onclick = () => document.getElementById('import-file').click();
document.getElementById('import-file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { importTrackText(r.result); openLoad(); alert('Imported. Tap it in the list to open.'); } catch (err) { alert('Import failed: ' + err.message); } e.target.value = ''; };
  r.readAsText(f);
};

// v7.3: when a corner moves (flags added/deleted at a corner, or a leg removed), force a fresh exit choice
function promptExit(leg, why) {
  const li = legs.indexOf(leg);
  if (li < 0 || li >= legs.length - 1) return; // only corners into a following leg
  const last = leg.flags[leg.flags.length - 1];
  const cur = (last && last.direction) || leg.exitDir || null;
  const labels = { '90L':'90° L', '90R':'90° R', 'obtL':'Obtuse L', 'obtR':'Obtuse R', 'acL':'Acute L', 'acR':'Acute R' };
  const dirs = ['90L','90R','obtL','obtR']; if (allowAcute(level)) dirs.push('acL','acR');
  document.getElementById('exit-title').textContent = 'Leg ' + (li + 1) + ' corner moved: choose exit';
  document.getElementById('exit-why').innerHTML = why + '<br>Corner is now at Flag ' + (last.isStart ? 0 : last.id) + ' (' + (last.isStart ? 0 : last.id * FLAG_M) + 'm). Previous exit: <b>' + (cur ? labels[cur] || cur : 'none') + '</b>';
  const box = document.getElementById('exit-btns');
  box.innerHTML = dirs.map(d => `<button type="button" data-dir="${d}" style="background:#4caf50;color:#000;padding:10px;min-width:42%;">${labels[d]}</button>`).join('')
    + (cur ? `<button type="button" data-dir="${cur}" style="background:#555;color:#fff;padding:10px;min-width:88%;">Keep ${labels[cur] || cur}</button>` : '');
  box.querySelectorAll('button').forEach(b => b.onclick = () => {
    const d = b.dataset.dir;
    leg.flags.forEach(f => { if (f !== last && !f.isStart) f.direction = null; });
    last.direction = d; leg.exitDir = d;
    if (legs[li + 1]) legs[li + 1].entryDir = d;
    document.getElementById('exit-modal').classList.remove('show');
    render(); drawMud(); autoSave();
  });
  document.getElementById('exit-modal').classList.add('show');
}
